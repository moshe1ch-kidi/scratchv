 name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and Build
        run: |
          # נכנסים לתיקייה ומריצים התקנה ובנייה
          if [ -d "scratchv" ]; then
            echo "Entering scratchv directory..."
            cd scratchv
            npm install
            npm run build
          else
            echo "Error: scratchv directory not found!"
            exit 1
          fi
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # נתיב ספציפי ומדויק לתיקיית התוצר שנבנתה
          path: 'scratchv/dist/'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
