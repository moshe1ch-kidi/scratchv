name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and Build
        run: |
          # בדיקה האם אנחנו בתוך תיקיית scratchv או בשורש המאגר
          if [ -d "scratchv" ]; then
            echo "Detected scratchv directory"
            cd scratchv
          else
            echo "scratchv directory not found, staying in root"
          fi
          
          npm install
          npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # הקוד הזה יחפש את תיקיית dist איפה שהיא לא תהיה
          path: |
            **/dist
