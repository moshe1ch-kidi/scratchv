name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List files (Debug)
        run: ls -R  # הפקודה הזו תדפיס לנו את כל הקבצים והתיקיות במאגר

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and Build
        run: |
          # ננסה למצוא את התיקייה באופן גמיש יותר
          TARGET_DIR=$(find . -maxdepth 1 -type d -iname "scratchv" | head -n 1)
          
          if [ -n "$TARGET_DIR" ]; then
            echo "Found directory at: $TARGET_DIR"
            cd "$TARGET_DIR"
            npm install
            npm run build
          else
            echo "COULD NOT FIND SCRATCHV! Printing current path:"
            pwd
            ls -F
            exit 1
          fi
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # נחפש את ה-dist בכל מקום שנוצר
          path: './**/dist/'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
