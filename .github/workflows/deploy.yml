 name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  # מאפשר להריץ את ה-Workflow גם ידנית דרך הטאב Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# מבטיח שאם תדחוף קוד חדש בזמן ש-Build ישן רץ, הישן יתבטל כדי לחסוך זמן
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # ביטלתי את ה-cache זמנית כדי לוודא התקנה נקייה ללא שגיאות lockfile
          # cache: 'npm' 

      - name: Install Dependencies
        # שינינו מ-npm ci ל-npm install כדי להתגבר על חוסר הסנכרון בגרסאות
        run: npm install

      - name: Build
        run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # וודא שתיקיית הפלט של Vite היא אכן dist
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
